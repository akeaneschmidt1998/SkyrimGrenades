; Fire Pots: craftable bombs.
;
; A bomb is TRIGGER x PAYLOAD x STRENGTH, and every combination is its own item, e.g.
; "Moderate Fire Bomb (Short Fuse)".
;   Triggers   Impact (bursts on contact), Short Fuse (bounces, 1.5 s), Long Fuse (4 s),
;              Tripwire (set down; bursts when someone comes within ~1.7 m)
;   Payloads   Frag, Fire, Frost, Oil, Smoke, Fear, Frenzy, Concussion
;   Strengths  Mild, Moderate (2x the ingredients, bigger and stronger), Major (3x)
;
; Bombs are scrolls: Scrolls tab, buy/sell/stash/favorite, equip to a hand. With a bomb in a hand,
; HOLD that hand's attack button to wind up and RELEASE to throw (or place a tripwire). G does
; the same without equipping anything. V switches to the next bomb you carry. H opens the
; bomb-making table anywhere (pick kind, strength, payload and filling; it shows what one takes).
;
; Most of this is also in the MCM (Mod Configuration > Fire Pots, needs SkyUI + MCM Helper). The
; MCM saves to Data\MCM\Settings\FirePots.ini, which overrides this file.
;
; Key codes: 0 = unbound, 1-255 = keyboard DirectX scan code,
;            256 = LMB, 257 = RMB, 258 = MMB, 259 = Mouse 4, 260 = Mouse 5
;   handy keyboard codes: 34 = G, 47 = V, 35 = H, 45 = X, 46 = C, 201 = Page Up
; Distances are in game units (70 units ~ 1 m).

[Throw]
iThrowKey = 34
iCycleKey = 47
iReloadConfigKey = 0
; Launch speed (units/s) of a quick toss and of a full wind-up (650 lands ~12 m away)
fMinSpeed = 250
fMaxSpeed = 650
fChargeSeconds = 1.0
fLoftDegrees = 12
; How far ahead a tripwire can be set down
fPlaceReach = 250
fMinHoldMs = 150
fCooldownMs = 600
bCancelOnBlock = 1
sThrowNode = NPC L Hand [LHnd]
sThrowNodeRight = NPC R Hand [RHnd]
fProjectileScale = 0.6

[Preview]
; Arc and landing ring while winding up. Off by default.
bShowArc = 0
fArcStep = 0.033
fArcMaxTime = 4.0
bShowBlastRing = 1
fArcThickness = 3
fArcOpacity = 0.9
; Wind-up meter under the crosshair (shown even with the arc off)
bShowChargeMeter = 1

[Calibration]
; Gravity the preview uses, units/s^2. 0 = learn it from your first impact throw (the log's
; "Flight check" line); put that number here to skip the learning.
fGravityUnits = 0
bAutoCalibrate = 1
bCalibrateSpeed = 0

[Crafting]
iCraftKey = 35
bCraftInCombat = 1

[Bottles]
; Drinking wine gives its empty bottle back. Set to 0 if another mod already does this.
bReturnEmptyBottles = 1
bUseBuiltInBottles = 1
bMatchBottlesByModel = 1
; sBottle = drink -> empty container

[Loot]
