; Fire Pots
; Hold G to wind up a throw: the longer you hold, the farther it goes, and an arc shows where the
; pot will fly and land (the ring is the blast radius; it turns red when the pot will hit someone
; directly). Release to throw. A quick tap, or pressing block, cancels without using a pot.
; Fire Pots are crafted at a cooking pot (1 Fire Salts + 1 Firewood -> 2 pots).
;
; Key codes: 0 = unbound, 1-255 = keyboard DirectX scan code,
;            256 = LMB, 257 = RMB, 258 = MMB, 259 = Mouse 4, 260 = Mouse 5
;   handy keyboard codes: 34 = G, 47 = V, 45 = X, 46 = C, 201 = Page Up
; Distances are in game units (1 unit ~ 1.4 cm; 70 units ~ 1 m).

[Throw]
; Hold to wind up, release to throw. 34 = G (free in vanilla)
iThrowKey = 34
; Re-read this file in game (0 = off)
iReloadConfigKey = 0
; Launch speed (units per second) at the shortest and the fullest wind-up
fMinSpeed = 700
fMaxSpeed = 1700
; Seconds of holding to reach full wind-up
fChargeSeconds = 1.0
; Extra upward angle over the crosshair, in degrees (makes it a lob rather than a line drive)
fLoftDegrees = 12
; Releasing sooner than this (milliseconds) cancels instead of throwing
fMinHoldMs = 150
; Minimum time between throws (milliseconds)
fCooldownMs = 600
; 1 = pressing block during the wind-up cancels it
bCancelOnBlock = 1
; Skeleton node the pot leaves from (left hand keeps your weapon hand free)
sThrowNode = NPC L Hand [LHnd]
; Size of the flying pot model
fProjectileScale = 0.6

[Preview]
bShowArc = 1
; Seconds of flight per traced segment, and how far ahead the arc is traced
fArcStep = 0.033
fArcMaxTime = 4.0
; Ring drawn where the pot lands; keep it equal to the explosion radius in FirePots.esp (160)
bShowBlastRing = 1
fBlastRadius = 160
fArcThickness = 3
fArcOpacity = 0.9
; Wind-up meter and pot count under the crosshair
bShowChargeMeter = 1

[Calibration]
; Gravity the preview uses, units/s^2. 0 = start from real-world gravity (687) and learn the
; engine's value from your first throw (written to Documents\My Games\Skyrim Special Edition\SKSE\
; FirePots.log as "Flight check"). Put the logged number here to skip the learning.
fGravityUnits = 0
; 1 = keep measuring throws and correct the preview (gravity, speed) automatically
bAutoCalibrate = 1

[Visuals]
; Models are borrowed from vanilla forms at load ("Plugin.esm|HEXID"), or give a mesh path
; relative to Data\Meshes (e.g. FirePots\FirePot.nif) once there's a custom model.
; GlazedPot01: the inventory item and the flying pot
sPotModel = Skyrim.esm|0B9BD2
; TrapOilLampExplosion01: the burst of fire (its light is borrowed too)
sExplosionModel = Skyrim.esm|070E5C

[Messages]
; Print throws and calibration to the console (~)
bPrintToConsole = 1
; Show "You have no Fire Pots." and similar in the top-left corner
bShowNotification = 1
